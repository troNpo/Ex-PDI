<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ex-PDI</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
<!-- Panel deslizante inferior (Bottom Sheet) -->
<div id="bottom-sheet" class="sheet-collapsed">
  <!-- Cabecera fija roja -->
  <div id="sheet-header">
    <div class="drag-handle"></div>
    
    <!-- Vista Principal: Búsqueda de PDI -->
    <div class="header-top-row" id="header-main-actions">
      <span class="sheet-title">Búsqueda de PDI</span>
      <div class="sheet-actions">
        <button class="sheet-btn" id="btn-help" aria-label="Ayuda">
          <img src="icons/help.svg" alt="Ayuda">
        </button>
        <button class="sheet-btn" id="btn-cancel" aria-label="Limpiar">
          <img src="icons/cancel.svg" alt="Limpiar">
        </button>
        <button class="sheet-btn" id="btn-check" aria-label="Aplicar">
          <img src="icons/check.svg" alt="Aplicar">
        </button>
        <button class="sheet-btn" id="btn-more" aria-label="Más opciones">
          <img src="icons/more.svg" alt="Más opciones">
        </button>
      </div>
    </div>

    <!-- Vista Secundaria / Pestañas (Oculta por defecto) -->
    <div class="header-top-row hidden" id="header-tabs-actions">
      <div class="sheet-actions tabs-bar">
        <button class="sheet-btn tab-btn" data-tab="main" aria-label="Volver">
          <img src="icons/back.svg" alt="Volver">
        </button>
        <button class="sheet-btn tab-btn active" data-tab="settings" aria-label="Ajustes de búsqueda">
          <img src="icons/settings-sliders.svg" alt="Ajustes">
        </button>
        <button class="sheet-btn tab-btn" data-tab="maps-layers" aria-label="Mapas y Capas">
          <img src="icons/map.svg" alt="Mapas y Capas">
        </button>
        <button class="sheet-btn tab-btn" data-tab="tools" aria-label="Herramientas">
          <img src="icons/tools.svg" alt="Herramientas">
        </button>
      </div>
    </div>
  </div>

  <!-- Contenido con scroll -->
  <div id="sheet-content">
    <div class="category-subheader">
      <span class="subheader-title">Categorías</span>
      <div class="toggle-container">
        <span class="toggle-label">Expandir nodos</span>
        <label class="switch">
          <input type="checkbox" id="expand-nodes-toggle">
          <span class="slider round"></span>
        </label>
      </div>
    </div>
    <ul class="poi-categories"></ul>
  </div>
</div>

  <!-- Buscador desplegable -->
  <div id="search-container">
    <div id="search-box" class="hidden">
      <input type="text" id="search-input" placeholder="Buscar lugar..." autocomplete="off">
      <ul id="search-results"></ul>
    </div>
    <button id="search-toggle" aria-label="Buscar">
      <img src="icons/search.svg" alt="Buscar" width="18" height="18">
    </button>
  </div>

  <div id="map"></div>
  <script src="script.js"></script>
</body>
</html>
